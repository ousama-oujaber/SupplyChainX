input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Parse the message if it's JSON
  if [message] =~ /^\{/ {
    json {
      source => "message"
    }
  }

  # Add timestamp parsing
  date {
    match => ["@timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # Remove sensitive data patterns
  mutate {
    remove_field => ["password", "token", "secret", "apiKey", "authorization"]
  }

  # Classify log type based on logger name
  if [logger_name] =~ /security/ {
    mutate {
      add_field => { "logType" => "SECURITY" }
    }
  } else if [logger_name] =~ /procurement|production|delivery|user/ {
    mutate {
      add_field => { "logType" => "BUSINESS" }
    }
  } else {
    mutate {
      add_field => { "logType" => "APPLICATION" }
    }
  }

  # Extract business identifiers
  if [message] =~ /ID: (\d+)/ {
    grok {
      match => { "message" => "ID: %{NUMBER:extractedId}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "logs-%{+YYYY.MM.dd}"
    # Template for index mapping
    template_overwrite => true
  }

  # Debug output to console (optional, can be removed in production)
  stdout {
    codec => rubydebug
  }
}

