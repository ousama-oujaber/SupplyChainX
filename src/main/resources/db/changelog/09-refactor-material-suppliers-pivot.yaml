databaseChangeLog:
  - changeSet:
      id: 9-create-supplier-materials-pivot-table
      author: protocol
      changes:
        - createTable:
            tableName: supplier_materials
            columns:
              - column:
                  name: supplier_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_supplier_materials_supplier
                    references: suppliers(id_supplier)
              - column:
                  name: material_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_supplier_materials_material
                    references: raw_materials(id_material)
              - column:
                  name: unit_price
                  type: DOUBLE
              - column:
                  name: min_order_quantity
                  type: INTEGER
              - column:
                  name: lead_time_days
                  type: INTEGER
              - column:
                  name: is_preferred
                  type: BOOLEAN
                  defaultValueBoolean: false
        - addPrimaryKey:
            tableName: supplier_materials
            columnNames: supplier_id, material_id
            constraintName: pk_supplier_materials

  - changeSet:
      id: 9-create-supplier-materials-indexes
      author: protocol
      changes:
        - createIndex:
            indexName: idx_supplier_materials_supplier
            tableName: supplier_materials
            columns:
              - column:
                  name: supplier_id
        - createIndex:
            indexName: idx_supplier_materials_material
            tableName: supplier_materials
            columns:
              - column:
                  name: material_id
        - createIndex:
            indexName: idx_supplier_materials_preferred
            tableName: supplier_materials
            columns:
              - column:
                  name: is_preferred

  - changeSet:
      id: 9-migrate-existing-material-suppliers
      author: protocol
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: material_suppliers
      changes:
        - sql:
            sql: |
              INSERT INTO supplier_materials (supplier_id, material_id, is_preferred)
              SELECT supplier_id, material_id, false
              FROM material_suppliers
              ON DUPLICATE KEY UPDATE is_preferred = is_preferred
      comment: "Migrate existing data from old material_suppliers table to new supplier_materials table"

  - changeSet:
      id: 9-drop-old-material-suppliers-table
      author: protocol
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: material_suppliers
      changes:
        - dropTable:
            tableName: material_suppliers
      comment: "Remove the old simple join table after migration"
